<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevAfeez — Request Logs</title>
    <link rel="icon" type="image/x-icon" href="/assets/logo.png">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,600;9..40,700;9..40,800&family=Inter:wght@400;500;600&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #04080f; --surf: #08101d; --panel: #0d1826;
            --border: rgba(255,255,255,0.07);
            --em: #10b981; --em-l: #34d399;
            --am: #f59e0b; --ro: #f43f5e; --cy: #22d3ee; --vi: #a78bfa;
            --text: #e2e8f0; --muted: #64748b;
        }
        body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

        body::before {
            content: ''; position: fixed; inset: 0; z-index: -2; pointer-events: none;
            background: radial-gradient(ellipse 50% 40% at 10% 20%, rgba(34,211,238,0.05) 0%, transparent 50%),
                        radial-gradient(ellipse 45% 50% at 90% 70%, rgba(16,185,129,0.04) 0%, transparent 50%);
        }
        body::after {
            content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none;
            background-image: radial-gradient(circle, rgba(255,255,255,0.014) 1px, transparent 1px);
            background-size: 28px 28px;
        }

        .page { max-width: 1100px; margin: 0 auto; padding: 1.5rem; }

        /* Header row */
        .top-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 1.75rem; }
        .top-left { display: flex; align-items: center; gap: 0.75rem; }
        .back-link { color: var(--muted); font-size: 12.5px; text-decoration: none; transition: color 0.15s; display: flex; align-items: center; gap: 0.35rem; }
        .back-link:hover { color: var(--em); }
        .breadcrumb-sep { color: var(--border); }
        .page-title { font-family: 'DM Sans', sans-serif; font-weight: 800; font-size: 20px; color: #fff; }
        .top-right { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
        .live-indicator { display: flex; align-items: center; gap: 0.4rem; font-family: 'Fira Code', monospace; font-size: 9px; font-weight: 600; color: var(--em); text-transform: uppercase; letter-spacing: 0.1em; }
        .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--em); animation: pulse 1.8s infinite; }
        .live-dot.paused { background: var(--muted); animation: none; }
        @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.3;} }

        .ctrl-btn {
            font-family: 'Fira Code', monospace; font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase;
            padding: 0.4rem 0.9rem; border-radius: 8px; border: 1px solid var(--border);
            background: rgba(255,255,255,0.03); color: var(--muted); cursor: pointer; transition: all 0.15s;
        }
        .ctrl-btn:hover { color: var(--text); border-color: rgba(255,255,255,0.15); }
        .ctrl-btn.active { background: rgba(16,185,129,0.1); border-color: rgba(16,185,129,0.3); color: var(--em); }

        /* Stats row */
        .stats-row { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-bottom: 1.5rem; }
        .stat-chip {
            display: flex; align-items: center; gap: 0.5rem;
            background: rgba(13,24,38,0.7); border: 1px solid var(--border); border-radius: 10px;
            padding: 0.55rem 0.9rem; font-size: 12px;
        }
        .stat-chip .num { font-family: 'DM Sans', sans-serif; font-weight: 800; font-size: 16px; color: #fff; }
        .stat-chip .lbl { color: var(--muted); font-size: 11px; }

        /* Filters */
        .filter-row { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-bottom: 1.25rem; }
        .f-btn {
            font-family: 'Fira Code', monospace; font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase;
            padding: 4px 12px; border-radius: 99px; border: 1px solid var(--border);
            background: var(--surf); color: var(--muted); cursor: pointer; transition: all 0.15s;
        }
        .f-btn:hover { color: var(--text); border-color: rgba(255,255,255,0.15); }
        .f-btn.active { background: rgba(34,211,238,0.1); border-color: rgba(34,211,238,0.3); color: var(--cy); }

        /* Log table */
        .log-card { background: rgba(13,24,38,0.7); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; backdrop-filter: blur(8px); }
        .log-head { display: grid; grid-template-columns: 140px 55px 1fr 65px 65px; gap: 0.5rem; padding: 0.6rem 1rem; border-bottom: 1px solid var(--border); }
        @media(max-width:640px) { .log-head { grid-template-columns: 110px 50px 1fr 55px; } }
        .log-col-hdr { font-family: 'Fira Code', monospace; font-size: 9px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
        .log-rows { max-height: 540px; overflow-y: auto; }
        .log-row {
            display: grid; grid-template-columns: 140px 55px 1fr 65px 65px; gap: 0.5rem;
            padding: 0.6rem 1rem; border-bottom: 1px solid rgba(255,255,255,0.03);
            transition: background 0.1s; border-left: 2px solid transparent;
            animation: slideIn 0.22s ease;
        }
        @media(max-width:640px) { .log-row { grid-template-columns: 110px 50px 1fr 55px; } .log-ms { display:none; } }
        @keyframes slideIn { from { opacity:0; transform:translateY(-4px); } to { opacity:1; transform:none; } }
        .log-row:hover { background: rgba(255,255,255,0.02); }
        .log-row:last-child { border-bottom: none; }
        .log-row.r2xx { border-left-color: rgba(52,211,153,0.4); }
        .log-row.r3xx { border-left-color: rgba(34,211,238,0.4); }
        .log-row.r4xx { border-left-color: rgba(245,158,11,0.5); }
        .log-row.r5xx { border-left-color: rgba(244,63,94,0.5); }
        .log-cell { font-family: 'Fira Code', monospace; font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; }
        .log-ts { color: #38485a; font-size: 10px; }
        .log-method.GET  { color: var(--em); }
        .log-method.POST { color: var(--cy); }
        .log-path { color: #7aa0c4; }
        .log-status { font-weight: 600; }
        .log-status.s2xx { color: var(--em); }
        .log-status.s3xx { color: var(--cy); }
        .log-status.s4xx { color: var(--am); }
        .log-status.s5xx { color: var(--ro); }
        .log-ms.fast { color: var(--em); }
        .log-ms.med  { color: var(--am); }
        .log-ms.slow { color: var(--ro); }

        .log-empty { text-align: center; padding: 3rem 1rem; color: var(--muted); font-size: 13px; }
        .log-empty i { font-size: 2rem; display: block; margin-bottom: 0.75rem; color: var(--border); }

        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: var(--surf); }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 3px; }
    </style>
</head>
<body>
<div class="page">
    <div class="top-bar">
        <div class="top-left">
            <a href="/docs" class="back-link"><i class="fas fa-arrow-left"></i>Docs</a>
            <span class="breadcrumb-sep">/</span>
            <span class="page-title">Request Logs</span>
        </div>
        <div class="top-right">
            <div class="live-indicator">
                <div class="live-dot" id="liveDot"></div>
                <span id="liveLabel">Live</span>
            </div>
            <button class="ctrl-btn" id="pauseBtn" onclick="togglePause()"><i class="fas fa-pause" style="margin-right:4px;"></i>Pause</button>
            <button class="ctrl-btn" onclick="clearLogs()"><i class="fas fa-trash" style="margin-right:4px;"></i>Clear</button>
        </div>
    </div>

    <div class="stats-row">
        <div class="stat-chip"><span class="num" id="sTotalReqs">0</span><span class="lbl">Total Requests</span></div>
        <div class="stat-chip"><span class="num" id="sOkRate" style="color:var(--em);">—</span><span class="lbl">Success Rate</span></div>
        <div class="stat-chip"><span class="num" id="sAvgMs">—</span><span class="lbl">Avg Latency</span></div>
        <div class="stat-chip"><span class="num" id="sErrCount" style="color:var(--ro);">0</span><span class="lbl">Errors</span></div>
    </div>

    <div class="filter-row" id="filterRow">
        <button class="f-btn active" data-filter="all">All</button>
        <button class="f-btn" data-filter="2xx">2xx OK</button>
        <button class="f-btn" data-filter="4xx">4xx</button>
        <button class="f-btn" data-filter="5xx">5xx</button>
        <button class="f-btn" data-filter="slow">Slow (&gt;500ms)</button>
    </div>

    <div class="log-card">
        <div class="log-head">
            <div class="log-col-hdr">Timestamp</div>
            <div class="log-col-hdr">Method</div>
            <div class="log-col-hdr">Path</div>
            <div class="log-col-hdr">Status</div>
            <div class="log-col-hdr log-ms">Time</div>
        </div>
        <div class="log-rows" id="logRows">
            <div class="log-empty"><i class="fas fa-satellite-dish"></i>Waiting for requests…</div>
        </div>
    </div>
</div>

<script>
    let paused = false;
    let allLogs = [];
    let activeFilter = 'all';

    document.getElementById('filterRow').addEventListener('click', e => {
        const btn = e.target.closest('.f-btn');
        if (!btn) return;
        document.querySelectorAll('.f-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeFilter = btn.dataset.filter;
        renderLogs();
    });

    function togglePause() {
        paused = !paused;
        const btn = document.getElementById('pauseBtn');
        const dot = document.getElementById('liveDot');
        const lbl = document.getElementById('liveLabel');
        dot.classList.toggle('paused', paused);
        btn.innerHTML = paused
            ? '<i class="fas fa-play" style="margin-right:4px;"></i>Resume'
            : '<i class="fas fa-pause" style="margin-right:4px;"></i>Pause';
        lbl.textContent = paused ? 'Paused' : 'Live';
    }

    function clearLogs() { allLogs = []; renderLogs(); updateStats(); }

    function statusClass(s) {
        if (s >= 200 && s < 300) return 's2xx';
        if (s >= 300 && s < 400) return 's3xx';
        if (s >= 400 && s < 500) return 's4xx';
        return 's5xx';
    }
    function rowClass(s) {
        if (s >= 200 && s < 300) return 'r2xx';
        if (s >= 300 && s < 400) return 'r3xx';
        if (s >= 400 && s < 500) return 'r4xx';
        return 'r5xx';
    }
    function msClass(ms) {
        if (ms < 200) return 'fast';
        if (ms < 500) return 'med';
        return 'slow';
    }
    function fmtTs(ts) {
        const d = new Date(ts);
        return d.toLocaleTimeString('en-GB', { hour12: false }) + '.' + String(d.getMilliseconds()).padStart(3,'0');
    }

    function filterLogs(logs) {
        if (activeFilter === 'all') return logs;
        if (activeFilter === '2xx') return logs.filter(l => l.status >= 200 && l.status < 300);
        if (activeFilter === '4xx') return logs.filter(l => l.status >= 400 && l.status < 500);
        if (activeFilter === '5xx') return logs.filter(l => l.status >= 500);
        if (activeFilter === 'slow') return logs.filter(l => l.ms > 500);
        return logs;
    }

    function renderLogs() {
        const rows = document.getElementById('logRows');
        const filtered = filterLogs(allLogs);
        if (!filtered.length) {
            rows.innerHTML = '<div class="log-empty"><i class="fas fa-satellite-dish"></i>No requests match the filter.</div>';
            return;
        }
        rows.innerHTML = filtered.map(l => `
            <div class="log-row ${rowClass(l.status)}">
                <div class="log-cell log-ts">${fmtTs(l.ts)}</div>
                <div class="log-cell log-method ${l.method}">${l.method}</div>
                <div class="log-cell log-path" title="${l.path}">${l.path}</div>
                <div class="log-cell log-status ${statusClass(l.status)}">${l.status}</div>
                <div class="log-cell log-ms ${msClass(l.ms)}">${l.ms}ms</div>
            </div>
        `).join('');
    }

    function updateStats() {
        const total = allLogs.length;
        const ok = allLogs.filter(l => l.status >= 200 && l.status < 300).length;
        const errs = allLogs.filter(l => l.status >= 400).length;
        const avgMs = total ? Math.round(allLogs.reduce((a,l) => a + l.ms, 0) / total) : 0;
        document.getElementById('sTotalReqs').textContent = total;
        document.getElementById('sOkRate').textContent = total ? Math.round(ok/total*100) + '%' : '—';
        document.getElementById('sAvgMs').textContent = total ? avgMs + 'ms' : '—';
        document.getElementById('sErrCount').textContent = errs;
    }

    async function poll() {
        if (paused) return;
        try {
            // Endpoint is /debug/logs (not /api/debug/logs); returns { total, showing, host, logs: [...] }
            const r = await fetch('/debug/logs?limit=200');
            if (!r.ok) return;
            const data = await r.json();
            const logs = Array.isArray(data) ? data : (data.logs || []);
            if (logs.length) {
                allLogs = logs;
                renderLogs();
                updateStats();
            }
        } catch {}
    }

    poll();
    setInterval(poll, 2500);
</script>
</body>
</html>
