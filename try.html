<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Try DevAfeez API — Free Search Playground</title>
    <link rel="icon" type="image/x-icon" href="/assets/logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #04080f; --surf: #08101d; --panel: #0d1826;
            --border: rgba(255,255,255,0.07);
            --em: #10b981; --em-l: #34d399;
            --am: #f59e0b; --am-l: #fbbf24;
            --vi: #a78bfa; --cy: #22d3ee;
            --text: #e2e8f0; --muted: #64748b;
        }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, sans-serif; overflow-x: hidden; min-height: 100vh; }
        a { text-decoration: none; color: inherit; }

        .aurora {
            position: fixed; inset: 0; z-index: -2;
            background: radial-gradient(ellipse 70% 55% at 70% 5%, rgba(16,185,129,0.1) 0%, transparent 55%),
                        radial-gradient(ellipse 55% 45% at 15% 85%, rgba(34,211,238,0.06) 0%, transparent 55%);
        }
        .dots {
            position: fixed; inset: 0; z-index: -1;
            background-image: radial-gradient(circle, rgba(255,255,255,0.018) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        /* Header */
        header {
            position: fixed; top: 0; left: 0; right: 0; z-index: 50;
            background: rgba(4,8,15,0.9); backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border); height: 60px;
        }
        .nav-inner { max-width: 1100px; margin: 0 auto; padding: 0 1.5rem; height: 60px; display: flex; align-items: center; justify-content: space-between; }
        .brand { display: flex; align-items: center; gap: 0.6rem; }
        .brand-icon { width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(135deg, var(--em), #059669); display: flex; align-items: center; justify-content: center; }
        .brand-icon i { color: #fff; font-size: 11px; }
        .brand-name { font-family: 'DM Sans', sans-serif; font-weight: 700; font-size: 14px; color: #fff; }
        .brand-tag { font-family: 'Fira Code', monospace; font-size: 10px; color: var(--muted); margin-left: 3px; }
        .nav-links { display: none; align-items: center; gap: 0.25rem; }
        @media(min-width:640px) { .nav-links { display: flex; } }
        .nav-link { font-size: 12.5px; font-weight: 500; color: var(--muted); padding: 0.4rem 0.75rem; border-radius: 8px; transition: all 0.15s; }
        .nav-link:hover { color: var(--text); background: rgba(255,255,255,0.04); }
        .nav-link.active { color: var(--em); background: rgba(16,185,129,0.06); border: 1px solid rgba(16,185,129,0.12); }
        .btn-key {
            padding: 0.45rem 1rem; border-radius: 9px; font-size: 12px; font-weight: 700;
            background: linear-gradient(135deg, var(--em), #059669); color: #fff;
            display: inline-flex; align-items: center; gap: 0.4rem;
            box-shadow: 0 0 20px rgba(16,185,129,0.2); transition: all 0.2s;
        }
        .btn-key:hover { box-shadow: 0 0 30px rgba(16,185,129,0.35); transform: translateY(-1px); }

        /* Main */
        main { max-width: 1100px; margin: 0 auto; padding: 5.5rem 1.5rem 5rem; }

        /* Hero */
        .hero { text-align: center; margin-bottom: 2.5rem; }
        .hero-badge {
            display: inline-flex; align-items: center; gap: 0.5rem;
            background: rgba(16,185,129,0.08); border: 1px solid rgba(16,185,129,0.22);
            border-radius: 99px; padding: 0.3rem 0.9rem;
            font-family: 'Fira Code', monospace; font-size: 10px; letter-spacing: 0.08em;
            text-transform: uppercase; color: var(--em); margin-bottom: 1rem;
        }
        .hero h1 { font-family: 'DM Sans', sans-serif; font-weight: 800; font-size: clamp(1.8rem, 5vw, 2.75rem); color: #fff; margin-bottom: 0.6rem; letter-spacing: -0.02em; }
        .hero h1 .grad { background: linear-gradient(135deg, var(--em-l), var(--cy)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .hero p { font-size: 14px; color: var(--muted); max-width: 480px; margin: 0 auto; line-height: 1.65; }

        /* Quota */
        .quota-bar-wrap {
            max-width: 520px; margin: 1.5rem auto 0;
            background: rgba(13,24,38,0.7); border: 1px solid var(--border);
            border-radius: 12px; padding: 0.9rem 1.1rem;
            display: flex; align-items: center; gap: 0.85rem;
        }
        .quota-icon { width: 32px; height: 32px; border-radius: 9px; background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.2); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .quota-icon i { color: var(--em); font-size: 12px; }
        .quota-info { flex: 1; }
        .quota-label { font-family: 'Fira Code', monospace; font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 0.35rem; }
        .quota-track { height: 4px; background: rgba(255,255,255,0.06); border-radius: 99px; overflow: hidden; }
        .quota-fill { height: 100%; background: linear-gradient(90deg, var(--em), var(--cy)); border-radius: 99px; transition: width 0.4s ease; }
        .quota-count { font-family: 'Fira Code', monospace; font-size: 10px; color: var(--muted); white-space: nowrap; }

        /* Search */
        .search-wrap { max-width: 700px; margin: 2rem auto 0; }
        .search-row { display: flex; gap: 0.6rem; margin-bottom: 0.85rem; }
        .search-input {
            flex: 1; background: rgba(8,16,29,0.9); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px; padding: 0.8rem 1.1rem 0.8rem 2.8rem; color: #fff; font-size: 14px;
            font-family: 'Inter', sans-serif; outline: none; transition: all 0.2s;
        }
        .search-input:focus { border-color: rgba(16,185,129,0.45); box-shadow: 0 0 0 3px rgba(16,185,129,0.08), 0 0 30px rgba(16,185,129,0.06); }
        .search-input::placeholder { color: var(--muted); }
        .search-icon-wrap { position: relative; flex: 1; }
        .search-icon { position: absolute; left: 0.9rem; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 12px; pointer-events: none; }
        .btn-search {
            padding: 0.8rem 1.5rem; border-radius: 12px; border: none; cursor: pointer;
            background: linear-gradient(135deg, var(--em), #059669); color: #fff;
            font-size: 13px; font-weight: 700; font-family: 'DM Sans', sans-serif;
            display: flex; align-items: center; gap: 0.45rem;
            box-shadow: 0 0 22px rgba(16,185,129,0.25); transition: all 0.2s; white-space: nowrap;
        }
        .btn-search:hover { transform: translateY(-1px); box-shadow: 0 0 32px rgba(16,185,129,0.4); }
        .btn-search:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }

        .type-tabs { display: flex; gap: 0.4rem; flex-wrap: wrap; }
        .type-tab {
            font-family: 'Fira Code', monospace; font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase;
            padding: 0.3rem 0.8rem; border-radius: 99px; border: 1px solid var(--border);
            background: transparent; color: var(--muted); cursor: pointer; transition: all 0.15s;
        }
        .type-tab:hover { color: var(--text); border-color: rgba(255,255,255,0.15); }
        .type-tab.active { background: rgba(16,185,129,0.1); border-color: rgba(16,185,129,0.3); color: var(--em); }

        /* Results */
        .results-header { display: flex; align-items: center; justify-content: space-between; margin: 2rem 0 1rem; }
        .results-label { font-family: 'Fira Code', monospace; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
        .results-count { font-family: 'Fira Code', monospace; font-size: 10px; color: var(--em); }
        .results-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1rem; }

        .result-card {
            background: rgba(13,24,38,0.8); border: 1px solid var(--border); border-radius: 14px;
            overflow: hidden; transition: all 0.22s; cursor: pointer;
        }
        .result-card:hover { border-color: rgba(16,185,129,0.25); transform: translateY(-2px); box-shadow: 0 8px 32px rgba(0,0,0,0.35), 0 0 20px rgba(16,185,129,0.05); }
        .result-poster { width: 100%; aspect-ratio: 2/3; object-fit: cover; background: var(--panel); display: block; }
        .result-body { padding: 0.85rem; }
        .result-meta { display: flex; align-items: center; gap: 0.4rem; margin-bottom: 0.5rem; flex-wrap: wrap; }
        .result-type-badge {
            font-family: 'Fira Code', monospace; font-size: 8.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em;
            padding: 2px 7px; border-radius: 99px;
        }
        .type-movie  { background: rgba(16,185,129,0.1); color: var(--em); border: 1px solid rgba(16,185,129,0.2); }
        .type-series { background: rgba(167,139,250,0.1); color: var(--vi); border: 1px solid rgba(167,139,250,0.2); }
        .type-anime  { background: rgba(245,158,11,0.1); color: var(--am); border: 1px solid rgba(245,158,11,0.2); }
        .result-year { font-size: 11px; color: var(--muted); font-family: 'Fira Code', monospace; }
        .result-title { font-family: 'DM Sans', sans-serif; font-weight: 700; font-size: 13.5px; color: #fff; line-height: 1.35; margin-bottom: 0.3rem; }
        .result-rating { display: flex; align-items: center; gap: 0.3rem; font-size: 11px; color: var(--am); }
        .result-rating i { font-size: 9px; }

        /* Skeleton */
        @keyframes shimmer { 0%{background-position:-200% 0;} 100%{background-position:200% 0;} }
        .skeleton {
            background: linear-gradient(90deg, rgba(13,24,38,0.8) 25%, rgba(20,35,55,0.9) 50%, rgba(13,24,38,0.8) 75%);
            background-size: 200% 100%; animation: shimmer 1.6s infinite; border-radius: 8px;
        }
        .skel-card { background: rgba(13,24,38,0.8); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
        .skel-poster { width: 100%; aspect-ratio: 2/3; }
        .skel-body { padding: 0.85rem; }
        .skel-line { height: 10px; margin-bottom: 7px; }

        .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(16,185,129,0.3); border-top-color: var(--em); border-radius: 50%; animation: spin 0.7s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .state-msg { text-align: center; padding: 3rem 1rem; color: var(--muted); }
        .state-msg i { font-size: 2.5rem; display: block; margin-bottom: 1rem; }
        .state-msg p { font-size: 14px; }
    </style>
</head>
<body>
<div class="aurora"></div>
<div class="dots"></div>

<header>
    <div class="nav-inner">
        <a href="/" class="brand">
            <div class="brand-icon"><i class="fas fa-play"></i></div>
            <span class="brand-name">DevAfeez<span class="brand-tag">API</span></span>
        </a>
        <nav class="nav-links">
            <a href="/" class="nav-link">Home</a>
            <a href="/docs" class="nav-link">Docs</a>
            <a href="/try" class="nav-link active">Try API</a>
            <a href="/request-key" class="nav-link">Request Key</a>
        </nav>
        <a href="/request-key" class="btn-key"><i class="fas fa-key" style="font-size:10px;"></i>Get API Key</a>
    </div>
</header>

<main>
    <div class="hero">
        <div class="hero-badge"><i class="fas fa-flask" style="font-size:9px;"></i>&nbsp;Free Playground — 50 calls/day</div>
        <h1>Try the API <span class="grad">for Free</span></h1>
        <p>Search movies, series, and anime instantly — no API key required. Up to 50 free calls per day.</p>

        <div class="quota-bar-wrap">
            <div class="quota-icon"><i class="fas fa-gauge-high"></i></div>
            <div class="quota-info">
                <div class="quota-label">Daily Quota</div>
                <div class="quota-track"><div class="quota-fill" id="quotaFill" style="width:0%"></div></div>
            </div>
            <div class="quota-count" id="quotaCount">— / 50</div>
        </div>
    </div>

    <!-- Search -->
    <div class="search-wrap">
        <div class="search-row">
            <div class="search-icon-wrap">
                <i class="fas fa-search search-icon"></i>
                <input type="text" class="search-input" id="searchInput" placeholder="Search movies, series, anime…" autocomplete="off" />
            </div>
            <button class="btn-search" id="searchBtn" onclick="doSearch()">
                <span id="searchBtnLabel">Search</span>
            </button>
        </div>
        <div class="type-tabs">
            <button class="type-tab active" data-type="">All Types</button>
            <button class="type-tab" data-type="movie">Movies</button>
            <button class="type-tab" data-type="series">Series</button>
            <button class="type-tab" data-type="anime">Anime</button>
        </div>
    </div>

    <!-- Results -->
    <div id="resultsArea"></div>
</main>

<script>
    let currentType = '';
    let usedToday = 0;
    const DAILY_LIMIT = 50;

    // Load quota from localStorage
    function loadQuota() {
        const today = new Date().toDateString();
        const stored = JSON.parse(localStorage.getItem('da_quota') || '{}');
        if (stored.date === today) {
            usedToday = stored.used || 0;
        } else {
            usedToday = 0;
            saveQuota();
        }
        updateQuotaUI();
    }
    function saveQuota() {
        localStorage.setItem('da_quota', JSON.stringify({ date: new Date().toDateString(), used: usedToday }));
    }
    function updateQuotaUI() {
        const pct = Math.min((usedToday / DAILY_LIMIT) * 100, 100);
        document.getElementById('quotaFill').style.width = pct + '%';
        document.getElementById('quotaCount').textContent = usedToday + ' / ' + DAILY_LIMIT;
    }

    // Type tabs
    document.querySelectorAll('.type-tab').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.type-tab').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentType = btn.dataset.type;
        });
    });

    // Enter key
    document.getElementById('searchInput').addEventListener('keydown', e => {
        if (e.key === 'Enter') doSearch();
    });

    function skeletonGrid() {
        return Array(8).fill(0).map(() => `
            <div class="skel-card">
                <div class="skel-poster skeleton"></div>
                <div class="skel-body">
                    <div class="skel-line skeleton" style="width:60%;"></div>
                    <div class="skel-line skeleton" style="width:85%;"></div>
                    <div class="skel-line skeleton" style="width:40%;"></div>
                </div>
            </div>
        `).join('');
    }

    function typeClass(type) {
        if (!type) return 'type-movie';
        const t = type.toLowerCase();
        if (t.includes('anime')) return 'type-anime';
        if (t.includes('series') || t.includes('show') || t.includes('tv')) return 'type-series';
        return 'type-movie';
    }
    function typeLabel(type) {
        if (!type) return 'Movie';
        const t = type.toLowerCase();
        if (t.includes('anime')) return 'Anime';
        if (t.includes('series') || t.includes('show') || t.includes('tv')) return 'Series';
        return 'Movie';
    }

    async function doSearch() {
        const q = document.getElementById('searchInput').value.trim();
        if (!q) return;

        if (usedToday >= DAILY_LIMIT) {
            document.getElementById('resultsArea').innerHTML = `
                <div class="state-msg">
                    <i class="fas fa-hourglass-end" style="color:var(--am);"></i>
                    <p>Daily free limit reached (${DAILY_LIMIT} calls). <a href="/request-key" style="color:var(--em);">Request an API key</a> for unlimited access.</p>
                </div>`;
            return;
        }

        const btn = document.getElementById('searchBtn');
        const lbl = document.getElementById('searchBtnLabel');
        btn.disabled = true;
        lbl.innerHTML = '<span class="spinner"></span>';

        document.getElementById('resultsArea').innerHTML = `
            <div class="results-header">
                <span class="results-label">Results</span>
            </div>
            <div class="results-grid">${skeletonGrid()}</div>`;

        try {
            const params = new URLSearchParams({ q });
            if (currentType) params.set('type', currentType);
            const r = await fetch(`/api/v1/search/${encodeURIComponent(q)}?${params}`);
            const data = await r.json();

            usedToday++;
            saveQuota();
            updateQuotaUI();

            if (!r.ok) throw new Error(data.message || 'Search failed');

            const items = data.results?.items || data.results || [];
            if (!items.length) {
                document.getElementById('resultsArea').innerHTML = `
                    <div class="state-msg">
                        <i class="fas fa-film" style="color:var(--muted);"></i>
                        <p>No results for "<strong>${escHtml(q)}</strong>". Try a different title.</p>
                    </div>`;
                return;
            }

            document.getElementById('resultsArea').innerHTML = `
                <div class="results-header">
                    <span class="results-label">Results</span>
                    <span class="results-count">${items.length} found</span>
                </div>
                <div class="results-grid">
                    ${items.map(item => `
                        <div class="result-card">
                            ${item.poster ? `<img class="result-poster" src="${escHtml(item.poster)}" alt="${escHtml(item.title || '')}" loading="lazy" onerror="this.style.display='none'">` : `<div class="result-poster" style="display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:2rem;"><i class="fas fa-film"></i></div>`}
                            <div class="result-body">
                                <div class="result-meta">
                                    <span class="result-type-badge ${typeClass(item.type)}">${typeLabel(item.type)}</span>
                                    ${item.year ? `<span class="result-year">${item.year}</span>` : ''}
                                </div>
                                <div class="result-title">${escHtml(item.title || item.name || 'Untitled')}</div>
                                ${item.rating ? `<div class="result-rating"><i class="fas fa-star"></i>${item.rating}</div>` : ''}
                            </div>
                        </div>
                    `).join('')}
                </div>`;
        } catch (err) {
            document.getElementById('resultsArea').innerHTML = `
                <div class="state-msg">
                    <i class="fas fa-exclamation-triangle" style="color:var(--am);"></i>
                    <p>${escHtml(err.message || 'Something went wrong. Please try again.')}</p>
                </div>`;
        }

        btn.disabled = false;
        lbl.textContent = 'Search';
    }

    function escHtml(s) {
        return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    loadQuota();

    // Show initial state
    document.getElementById('resultsArea').innerHTML = `
        <div class="state-msg">
            <i class="fas fa-search" style="color:var(--em);opacity:0.4;"></i>
            <p>Search for any movie, series, or anime to get started.</p>
        </div>`;
</script>
</body>
</html>
