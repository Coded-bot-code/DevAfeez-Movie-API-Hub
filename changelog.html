<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevAfeez API — Changelog</title>
    <link rel="icon" type="image/png" href="/assets/logo.png">
    <link rel="apple-touch-icon" href="/assets/apple-icon.jpg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #04080f; --surf: #08101d; --panel: #0d1826;
            --border: rgba(255,255,255,0.07);
            --em: #10b981; --em-l: #34d399;
            --am: #f59e0b; --am-l: #fbbf24;
            --vi: #a78bfa; --cy: #22d3ee; --ro: #f43f5e;
            --text: #e2e8f0; --muted: #64748b;
        }
        body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
        a { text-decoration: none; color: inherit; }

        body::before {
            content: ''; position: fixed; inset: 0; z-index: -2; pointer-events: none;
            background: radial-gradient(ellipse 60% 50% at 80% 10%, rgba(16,185,129,0.08) 0%, transparent 55%),
                        radial-gradient(ellipse 50% 40% at 10% 80%, rgba(245,158,11,0.06) 0%, transparent 55%);
        }
        body::after {
            content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none;
            background-image: radial-gradient(circle, rgba(255,255,255,0.016) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        header {
            position: sticky; top: 0; z-index: 50;
            background: rgba(4,8,15,0.9); backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border); padding: 0 1.5rem;
            height: 60px; display: flex; align-items: center; justify-content: space-between;
        }
        .brand { display: flex; align-items: center; gap: 0.6rem; }
        .brand img { width: 28px; height: 28px; border-radius: 8px; object-fit: cover; }
        .brand-name { font-family: 'DM Sans', sans-serif; font-weight: 700; font-size: 14px; color: #fff; }
        .brand-tag { font-family: 'Fira Code', monospace; font-size: 10px; color: var(--muted); margin-left: 3px; }
        .nav-links { display: flex; align-items: center; gap: 0.5rem; }
        .nav-link {
            font-size: 12.5px; color: var(--muted); padding: 0.4rem 0.75rem;
            border-radius: 8px; transition: all 0.15s;
        }
        .nav-link:hover { color: var(--text); background: rgba(255,255,255,0.04); }
        .nav-link.active { color: var(--em); }

        main { max-width: 820px; margin: 0 auto; padding: 3rem 1.5rem 6rem; }

        .hero { margin-bottom: 2.5rem; }
        .hero-eyebrow { font-family: 'Fira Code', monospace; font-size: 10px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--em); margin-bottom: 0.6rem; }
        .hero h1 { font-family: 'DM Sans', sans-serif; font-size: clamp(1.75rem, 4vw, 2.25rem); font-weight: 800; color: #fff; margin-bottom: 0.5rem; }
        .hero p { font-size: 14px; color: var(--muted); line-height: 1.65; max-width: 480px; }

        .filters { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 2.5rem; }
        .filter-btn {
            font-family: 'Fira Code', monospace; font-size: 10.5px; font-weight: 600;
            padding: 0.35rem 0.9rem; border-radius: 99px;
            border: 1px solid var(--border); background: transparent;
            color: var(--muted); cursor: pointer; transition: all 0.15s;
            letter-spacing: 0.04em;
        }
        .filter-btn:hover { color: var(--text); border-color: rgba(255,255,255,0.15); }
        .filter-btn.active { background: rgba(16,185,129,0.1); border-color: rgba(16,185,129,0.3); color: var(--em); }
        .filter-btn.all.active { background: rgba(16,185,129,0.1); border-color: rgba(16,185,129,0.3); color: var(--em); }
        .filter-btn.feature.active { background: rgba(34,211,238,0.1); border-color: rgba(34,211,238,0.3); color: var(--cy); }
        .filter-btn.fix.active { background: rgba(244,63,94,0.1); border-color: rgba(244,63,94,0.3); color: var(--ro); }
        .filter-btn.improvement.active { background: rgba(245,158,11,0.1); border-color: rgba(245,158,11,0.3); color: var(--am); }

        /* Timeline */
        .timeline { position: relative; }
        .timeline::before {
            content: ''; position: absolute; left: 13px; top: 0; bottom: 0; width: 1px;
            background: linear-gradient(to bottom, rgba(16,185,129,0.5), rgba(16,185,129,0.08) 85%, transparent);
        }
        .entry { position: relative; padding-left: 3rem; margin-bottom: 2rem; }
        .entry-dot {
            position: absolute; left: 6px; top: 6px; width: 16px; height: 16px;
            border-radius: 50%; border: 2px solid var(--bg);
            display: flex; align-items: center; justify-content: center;
        }
        .entry-dot.feature  { background: var(--cy); box-shadow: 0 0 12px rgba(34,211,238,0.5); }
        .entry-dot.fix      { background: var(--ro); box-shadow: 0 0 12px rgba(244,63,94,0.5); }
        .entry-dot.improvement { background: var(--am); box-shadow: 0 0 12px rgba(245,158,11,0.5); }
        .entry-dot i { font-size: 6px; color: #fff; }

        .entry-card {
            background: rgba(13,24,38,0.7); border: 1px solid var(--border); border-radius: 14px;
            padding: 1.25rem 1.4rem; backdrop-filter: blur(8px);
            transition: border-color 0.2s;
        }
        .entry-card:hover { border-color: rgba(16,185,129,0.18); }

        .entry-meta { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; margin-bottom: 0.75rem; }
        .entry-type {
            font-family: 'Fira Code', monospace; font-size: 9px; font-weight: 600;
            text-transform: uppercase; letter-spacing: 0.1em;
            padding: 2px 8px; border-radius: 99px; border: 1px solid;
        }
        .entry-type.feature     { background: rgba(34,211,238,0.08); border-color: rgba(34,211,238,0.25); color: var(--cy); }
        .entry-type.fix         { background: rgba(244,63,94,0.08); border-color: rgba(244,63,94,0.25); color: var(--ro); }
        .entry-type.improvement { background: rgba(245,158,11,0.08); border-color: rgba(245,158,11,0.25); color: var(--am); }
        .entry-ver {
            font-family: 'Fira Code', monospace; font-size: 10px; font-weight: 600;
            background: rgba(167,139,250,0.1); border: 1px solid rgba(167,139,250,0.22);
            color: var(--vi); padding: 2px 8px; border-radius: 99px;
        }
        .entry-date { font-family: 'Fira Code', monospace; font-size: 10px; color: var(--muted); margin-left: auto; }

        .entry-title { font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 700; color: #fff; margin-bottom: 0.4rem; }
        .entry-desc { font-size: 13px; color: var(--muted); line-height: 1.65; margin-bottom: 0.85rem; }

        .entry-changes { list-style: none; }
        .entry-changes li {
            display: flex; align-items: flex-start; gap: 0.6rem;
            font-size: 12.5px; color: #8899aa; padding: 0.25rem 0;
        }
        .entry-changes li::before {
            content: '→'; font-family: 'Fira Code', monospace; font-size: 10px;
            color: var(--em); flex-shrink: 0; margin-top: 2px;
        }

        .empty-state { text-align: center; padding: 3rem 1rem; color: var(--muted); }
        .empty-state i { font-size: 2.5rem; margin-bottom: 1rem; color: var(--border); display: block; }
    </style>
</head>
<body>
    <header>
        <a href="/" class="brand">
            <img src="/assets/logo.png" alt="DevAfeez">
            <span class="brand-name">DevAfeez<span class="brand-tag">API</span></span>
        </a>
        <nav class="nav-links">
            <a href="/" class="nav-link">Home</a>
            <a href="/docs" class="nav-link">Docs</a>
            <a href="/changelog" class="nav-link active">Changelog</a>
            <a href="/try" class="nav-link">Try</a>
        </nav>
    </header>

    <main>
        <div class="hero">
            <div class="hero-eyebrow"><i class="fas fa-scroll" style="margin-right:0.4rem;"></i>Release history</div>
            <h1>Changelog</h1>
            <p>Every update, fix, and improvement to the DevAfeez API — in reverse chronological order.</p>
        </div>

        <div class="filters" id="filters">
            <button class="filter-btn all active" data-type="all">All</button>
            <button class="filter-btn feature" data-type="feature">Features</button>
            <button class="filter-btn fix" data-type="fix">Bug Fixes</button>
            <button class="filter-btn improvement" data-type="improvement">Improvements</button>
        </div>

        <div class="timeline" id="timeline">
            <div style="text-align:center;padding:2rem;color:var(--muted);font-size:13px;">
                <i class="fas fa-spinner fa-spin" style="display:block;margin-bottom:0.75rem;font-size:1.5rem;color:var(--em);"></i>
                Loading changelog…
            </div>
        </div>
    </main>

    <script>
        const TYPE_ICONS = { feature: 'fa-star', fix: 'fa-bug', improvement: 'fa-arrow-up' };
        let allEntries = [];

        function renderEntries(entries) {
            const timeline = document.getElementById('timeline');
            if (!entries.length) {
                timeline.innerHTML = '<div class="empty-state"><i class="fas fa-inbox"></i><p>No entries found.</p></div>';
                return;
            }
            timeline.innerHTML = entries.map(e => `
                <div class="entry" data-type="${e.type}">
                    <div class="entry-dot ${e.type}"><i class="fas ${TYPE_ICONS[e.type] || 'fa-circle'}" style="font-size:6px;color:#fff;"></i></div>
                    <div class="entry-card">
                        <div class="entry-meta">
                            <span class="entry-type ${e.type}">${e.type}</span>
                            <span class="entry-ver">${e.version}</span>
                            <span class="entry-date">${e.date}</span>
                        </div>
                        <div class="entry-title">${escHtml(e.title)}</div>
                        <div class="entry-desc">${escHtml(e.description)}</div>
                        ${e.changes && e.changes.length ? `
                            <ul class="entry-changes">
                                ${e.changes.map(c => `<li>${escHtml(c)}</li>`).join('')}
                            </ul>
                        ` : ''}
                    </div>
                </div>
            `).join('');
        }

        function escHtml(s) {
            return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        // Filters
        document.getElementById('filters').addEventListener('click', e => {
            const btn = e.target.closest('.filter-btn');
            if (!btn) return;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const type = btn.dataset.type;
            const filtered = type === 'all' ? allEntries : allEntries.filter(x => x.type === type);
            renderEntries(filtered);
        });

        async function loadChangelog() {
            try {
                const r = await fetch('/api/changelog');
                if (!r.ok) throw new Error();
                const data = await r.json();
                // Server returns { total, results } — fall back for other shapes
                allEntries = Array.isArray(data) ? data : (data.results || data.changelog || data.entries || []);
                renderEntries(allEntries);
            } catch {
                document.getElementById('timeline').innerHTML =
                    '<div class="empty-state"><i class="fas fa-exclamation-circle" style="color:var(--ro);"></i><p>Could not load changelog.</p></div>';
            }
        }
        loadChangelog();
    </script>
</body>
</html>
