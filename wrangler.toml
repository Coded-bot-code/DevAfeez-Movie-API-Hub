name = "movieapi"
main = "worker.js"
compatibility_date = "2025-11-17"
account_id = "0a300d7512171ae3b8505f0baac700f1"

[observability]
enabled = true

# Static assets — bundled at deploy time, no KV writes needed
[assets]
directory = "."
binding = "ASSETS"

# KV namespace (kept for API-key store and any legacy data)
[[kv_namespaces]]
binding = "KV_STORE"
id = "e8bbfc51effc447a9a6f77dc824b65d0"
